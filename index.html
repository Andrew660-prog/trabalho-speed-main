<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouvidoria Digital — EEEP Dom Walfrido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="hero-page">
  <div class="hero-img-panel">
    <img src="assets/img/escola.jpg" alt="EEEP Dom Walfrido Teixeira Vieira">
    <div class="hero-img-overlay">
      <div class="hero-img-label">Escola Estadual de Educação Profissional</div>
      <h1 class="hero-img-title">Dom Walfrido<br>Teixeira Vieira</h1>
      <p class="hero-img-sub">Fortaleza — Ceará</p>
    </div>
  </div>
  <div class="hero-action-panel">
    <div class="hero-logo">
      <div class="hero-logo-icon"><i class="fas fa-bullhorn"></i></div>
      <div class="hero-logo-text">
        Ouvidoria Digital
        <small>Canal Oficial de Comunicação</small>
      </div>
    </div>
    <p class="hero-heading">Como deseja se manifestar?</p>
    <div class="action-cards">
      <button class="action-card" onclick="window.location.href='dashboard.html?anonimo=1'">
        <div class="action-card-icon"><i class="fas fa-user-secret"></i></div>
        <div class="action-card-body">
          <div class="action-card-title">Manifestação Anônima</div>
          <div class="action-card-desc">Sem necessidade de identificação</div>
        </div>
        <i class="fas fa-arrow-right action-card-arrow"></i>
      </button>
      <button class="action-card" onclick="window.location.href='login.html'">
        <div class="action-card-icon"><i class="fas fa-id-card"></i></div>
        <div class="action-card-body">
          <div class="action-card-title">Manifestação Identificada</div>
          <div class="action-card-desc">Acesse com sua conta</div>
        </div>
        <i class="fas fa-arrow-right action-card-arrow"></i>
      </button>
    </div>
    <div class="type-tags">
      <span class="type-tag tag-green"><i class="fas fa-thumbs-up me-1"></i>Elogio</span>
      <span class="type-tag tag-blue"><i class="fas fa-lightbulb me-1"></i>Sugestão</span>
      <span class="type-tag tag-gold"><i class="fas fa-triangle-exclamation me-1"></i>Reclamação</span>
      <span class="type-tag tag-red"><i class="fas fa-shield-halved me-1"></i>Denúncia</span>
    </div>
    <div class="hero-footer-link">
      Ainda não tem conta? <a href="cadastro.html">Cadastre-se gratuitamente</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
